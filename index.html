<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#E896B8" />
  <title>Carol´s · Mis pedidos</title>
  <link rel="icon" href="img/logo.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="login">
    <img class="logo" src="img/logo.png" alt="Carol´s" />
    <h1>Distribuidora Carol´s</h1>
    <p class="sub">Ingrese con el acceso que le compartimos por WhatsApp</p>

    <form id="form-login" class="vidrio" novalidate>
      <div class="campo" id="campo-telefono">
        <label for="telefono">Correo</label>
        <input id="telefono" type="email" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" placeholder="su correo" />
        <div class="error-texto">Ingrese su correo</div>
      </div>
      <div class="campo" id="campo-contrasena">
        <label for="contrasena">Contraseña</label>
        <div class="con-ojo">
          <input id="contrasena" type="password" autocomplete="current-password" />
          <button type="button" class="ojo" id="btn-ojo" aria-label="Mostrar contraseña" aria-pressed="false">
            <svg class="ojo-abierto" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="ojo-tachado" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.9 10.9 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <div class="error-texto">Ingrese su contraseña</div>
      </div>
      <button class="btn btn-bloque" id="btn-entrar" type="submit">Entrar</button>
      <p id="mensaje" class="ayuda" style="margin-top:12px;"></p>
    </form>

    <p class="ayuda">¿No tiene usuario? Escríbanos por WhatsApp y se lo creamos.</p>
    <div class="pie-marca"><img src="img/powered.png" alt="Powered by App Factory" /></div>
  </div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
